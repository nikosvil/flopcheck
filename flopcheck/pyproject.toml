[project]
name = "flopcheck"
version = "0.1.0"
description = "Reference implementation of Annex A.2 of the EU AI Act GPAI Guidelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flopcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
